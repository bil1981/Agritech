[changelog]
header = """
# 📰 Changelog\n
Toutes les modifications notables apportées à ce projet sont documentées dans ce fichier.\n
"""
body = """
{% if version %}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
    ## [Non publié]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

commit_parsers = [
  { message = "^feat", group = "🚀 Nouvelles fonctionnalités" },
  { message = "^fix", group = "🐛 Corrections de bugs" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performances" },
  { message = "^refactor", group = "♻️️ Refactorisation" },
  { message = "^style", group = "🎨 Style & Formatage" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "⚙️ Maintenance & CI/CD" },
  { message = ".*", group = "Autres changements" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"

[tool.pytest.ini_options]
addopts = "-p no:logfire"
