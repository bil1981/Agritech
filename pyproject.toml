[project]
name = "p1-code-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bil1981/OpenclassroomsMLOPSProject", email = "babouribila@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "logfire>=5.4.0",
    "mlflow>=3.17.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "plotly>=7.1.0",
    "scikit-learn==1.7.2",
    "streamlit>=1.66.1",
]

[project.scripts]
p1-code-python = "p1_code_python:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-p no:logfire"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
]
